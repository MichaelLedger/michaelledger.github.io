<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>JSON Studio</title>
  <script>
    (function () {
      var key = 'json-studio-theme';
      var theme = localStorage.getItem(key);
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    :root {
      --header-height: 56px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f1117;
      --bg-elevated: #161b22;
      --bg-hover: #1c2333;
      --border: #2d333b;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-soft: rgba(88, 166, 255, 0.12);
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #ffffff;
      --bg-elevated: #f6f8fa;
      --bg-hover: #eaeef2;
      --border: #d0d7de;
      --text: #1f2328;
      --text-muted: #656d76;
      --accent: #0969da;
      --accent-soft: rgba(9, 105, 218, 0.1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      height: 100vh;
      height: 100dvh;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: var(--header-height);
      padding: 0 20px;
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
      padding-top: max(0px, env(safe-area-inset-top));
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
      flex-wrap: wrap;
    }

    .logo-block {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #58a6ff, #a371f7);
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }

    .logo-block[data-tool="color"] .logo-icon {
      background: linear-gradient(135deg, #f778ba, #a371f7);
      font-size: 13px;
    }

    .tool-switch {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      flex-shrink: 0;
    }

    .tool-switch-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 10px;
      border: none;
      border-radius: 6px;
      background: transparent;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }

    .tool-switch-link:hover {
      color: var(--text);
      background: var(--bg-hover);
    }

    .tool-switch-link.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .header-spacer { flex: 1; }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .icon-btn:hover {
      background: var(--bg-hover);
      color: var(--accent);
    }

    .main-content {
      grid-row: 2;
      grid-column: 1;
      position: relative;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
    }

    .main-content.is-hidden {
      visibility: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .main-content:not(.is-hidden) {
      visibility: visible;
      z-index: 1;
    }

    .tool-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }

    @media (max-width: 768px) {
      .header { gap: 8px; padding: 8px 12px; }
      .logo-text {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tool-switch-link { padding: 5px 8px; font-size: 11px; }
      .icon-btn { width: 36px; height: 36px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo-block" id="logo-block" data-tool="json">
        <div class="logo">
          <div class="logo-icon" id="shell-logo-icon">{ }</div>
          <span class="logo-text" id="shell-logo-text">JSON Studio</span>
        </div>
        <nav class="tool-switch" aria-label="Switch tool">
          <button type="button" class="tool-switch-link active" data-tool="json" aria-current="page">JSON</button>
          <button type="button" class="tool-switch-link" data-tool="color">RGB ↔ Hex</button>
        </nav>
      </div>
      <div class="header-spacer"></div>
      <button type="button" class="icon-btn" id="btn-theme-toggle" title="Switch theme" aria-label="Switch theme">☀</button>
    </header>

    <div class="main-content" id="main-json" data-tool="json">
      <iframe class="tool-frame" id="frame-json" title="JSON Studio" src="json-studio.html?embed=1"></iframe>
    </div>

    <div class="main-content is-hidden" id="main-color" data-tool="color" aria-hidden="true">
      <iframe class="tool-frame" id="frame-color" title="RGB ↔ Hex Color Converter" src="rgb-to-hex.html?embed=1"></iframe>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const THEME_KEY = 'json-studio-theme';
      const $ = (sel) => document.querySelector(sel);

      const TOOL_BRAND = {
        json: { icon: '{ }', text: 'JSON Studio' },
        color: { icon: '#', text: 'Color Converter' },
      };

      function getTheme() {
        const t = localStorage.getItem(THEME_KEY);
        return t === 'light' || t === 'dark' ? t : null;
      }

      function broadcastTheme(theme) {
        document.querySelectorAll('.tool-frame').forEach((frame) => {
          frame.contentWindow?.postMessage({ type: 'json-studio-theme', theme: theme }, '*');
        });
      }

      function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem(THEME_KEY, theme);
        const btn = $('#btn-theme-toggle');
        if (btn) btn.textContent = theme === 'light' ? '☾' : '☀';
        broadcastTheme(theme);
      }

      function initThemeToggle() {
        let theme = getTheme();
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        setTheme(theme);
        $('#btn-theme-toggle')?.addEventListener('click', () => {
          setTheme(getTheme() === 'light' ? 'dark' : 'light');
        });
      }

      function getToolFromHash() {
        return location.hash === '#color' ? 'color' : 'json';
      }

      function switchTool(tool, updateHistory) {
        const views = {
          json: document.getElementById('main-json'),
          color: document.getElementById('main-color'),
        };
        const buttons = document.querySelectorAll('.tool-switch-link[data-tool]');

        Object.keys(views).forEach((name) => {
          const active = name === tool;
          const view = views[name];
          if (!view) return;
          view.classList.toggle('is-hidden', !active);
          view.setAttribute('aria-hidden', active ? 'false' : 'true');
          if ('inert' in view) view.inert = !active;
        });

        buttons.forEach((btn) => {
          const active = btn.dataset.tool === tool;
          btn.classList.toggle('active', active);
          if (active) btn.setAttribute('aria-current', 'page');
          else btn.removeAttribute('aria-current');
        });

        const brand = TOOL_BRAND[tool] || TOOL_BRAND.json;
        const logoBlock = $('#logo-block');
        const logoIcon = $('#shell-logo-icon');
        const logoText = $('#shell-logo-text');
        if (logoBlock) logoBlock.dataset.tool = tool;
        if (logoIcon) logoIcon.textContent = brand.icon;
        if (logoText) logoText.textContent = brand.text;

        document.title = tool === 'color' ? 'Color Converter — JSON Studio' : 'JSON Studio';

        if (updateHistory !== false) {
          const hash = tool === 'color' ? '#color' : '#json';
          if (location.hash !== hash) {
            history.pushState({ tool: tool }, '', hash);
          }
        }
      }

      function initToolSwitch() {
        document.querySelectorAll('.tool-switch-link[data-tool]').forEach((btn) => {
          btn.addEventListener('click', () => switchTool(btn.dataset.tool));
        });
        window.addEventListener('popstate', (e) => {
          switchTool(e.state?.tool || getToolFromHash(), false);
        });
        window.addEventListener('message', (e) => {
          if (e.data?.type === 'json-studio-switch-tool') {
            switchTool(e.data.tool);
          }
        });
        switchTool(getToolFromHash(), false);
      }

      initThemeToggle();
      initToolSwitch();
    })();
  </script>
</body>
</html>
