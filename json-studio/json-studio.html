          <input type="checkbox" id="opt-collapsed" checked> Collapse
        </label>
        <label class="option-label" title="Allow root element to be collapsed">
          <input type="checkbox" id="opt-root-collapsable"> Root collapse
        </label>
        <label class="option-label" title="Surround keys with quotes">
          <input type="checkbox" id="opt-with-quotes" checked> Key quotes
        </label>
        <label class="option-label" title="Linkify URL values">
          <input type="checkbox" id="opt-with-links" checked> Links
        </label>
        <div class="cache-badge" id="cache-badge" title="Local cache vs browser storage quota">
          <span id="cache-label">0 B / …</span>
          <div class="cache-bar"><div class="cache-bar-fill" id="cache-bar-fill" style="width:0%"></div></div>
        </div>
      </div>
    </header>

    <div class="tool-body">
      <div class="page-intro">
        <h1 class="page-title">JSON Viewer</h1>
        <p class="page-desc">Parse, format, and explore JSON with a collapsible tree view. Parse history is saved locally in your browser.</p>
      </div>
      <div class="main">
      <button type="button" class="sidebar-backdrop" id="sidebar-backdrop" hidden aria-label="Close history panel"></button>
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-expanded-only">
          <div class="sidebar-header">
            <div class="sidebar-header-row">
              <div class="sidebar-title">Parse History</div>
              <button type="button" class="icon-btn" id="btn-sidebar-collapse" title="Collapse history panel" aria-label="Collapse history panel">◀</button>
            </div>
            <input type="search" class="search-input" id="history-search" placeholder="Search history…">
            <div class="cache-path" id="cache-path">Browser storage (IndexedDB)</div>
          </div>
          <div class="history-list" id="history-list">
            <div class="history-empty">Parse JSON to save history locally.</div>
          </div>
          <div class="sidebar-footer">
            <button class="btn btn-danger" id="btn-clear-history">Clear All</button>
          </div>
        </div>
        <div class="sidebar-collapsed-only">
          <button type="button" class="icon-btn" id="btn-sidebar-expand" title="Expand history panel" aria-label="Expand history panel">▶</button>
        </div>
      </aside>

      <div class="workspace" id="workspace">
        <section class="panel panel-input">
          <div class="panel-header">
            <span>Input</span>
            <span id="input-stats"></span>
          </div>
          <div class="panel-body">
            <textarea id="json-input" spellcheck="false" autocomplete="off" placeholder="Paste JSON here, or drop a .json file…"></textarea>
          </div>
        </section>
        <div class="workspace-resizer" id="workspace-resizer" role="separator" aria-orientation="vertical" aria-label="Resize input and tree panels" tabindex="0"></div>
        <section class="panel panel-tree">
          <div class="panel-header">
            <span>Tree View</span>
            <span id="parse-status"></span>
          </div>
          <div class="panel-body">
            <div id="json-renderer"></div>
          </div>
        </section>
      </div>
    </div>
    </div>
  </div>

  <div class="drop-overlay" id="drop-overlay">
    <div class="drop-message">Drop JSON file here</div>
  </div>
  <div class="toast-container" id="toast-container"></div>
  <div class="toast toast-confirm" id="toast-confirm" role="alertdialog" aria-labelledby="toast-confirm-msg" hidden>
    <span class="toast-confirm-msg" id="toast-confirm-msg">Clear all parse history?</span>
    <div class="toast-confirm-actions">
      <button type="button" class="btn" id="toast-confirm-cancel">Cancel</button>
      <button type="button" class="btn btn-danger" id="toast-confirm-ok">Clear</button>
    </div>
  </div>

<script>
(function () {
  'use strict';

  /* ── Constants ─────────────────────────────────────────────── */
  const DB_NAME = '.json-studio';
  const DB_VERSION = 4;
  const STORE_HISTORY = 'history';
  const STORE_CONTENT = 'content';
  const STORAGE_FALLBACK_QUOTA = 10 * 1024 * 1024 * 1024; // if Storage API unavailable

  const PARSE_WORKER_THRESHOLD = 64 * 1024; // offload parse to worker above 64 KB
  const AUTO_EXPAND_MAX_CHILDREN = 1000; // auto-expand only when a collection has at most this many children
  const MAX_STRING_DISPLAY = 500;
  const MAX_LINKIFY_LENGTH = 20000; // maxTokenizationLineLength
  const DOM_BATCH_SIZE = 250; // nodes per animation frame when expanding large lists

  const SAMPLE_JSON = `{
  "id": 1001,
  "type": "donut",
  "name": "Michael Ledger",
  "description": "https://www.google.com",
  "price": 2.55,
  "available": {
    "store": 42,
    "warehouse": 600
  },
  "toppings": [
    { "id": 5001, "type": "None" },
    { "id": 5002, "type": "Glazed" },
    { "id": 5005, "type": "Sugar" }
  ]
}`;

  /* ── DOM refs ────────────────────────────────────────────────── */
  const $ = (sel) => document.querySelector(sel);
  const jsonInput = $('#json-input');
  const jsonRenderer = $('#json-renderer');
  const historyList = $('#history-list');
  const historySearch = $('#history-search');
  const cacheLabel = $('#cache-label');
  const cacheBarFill = $('#cache-bar-fill');
  const cacheBadge = $('#cache-badge');
  const parseStatus = $('#parse-status');
  const inputStats = $('#input-stats');
  const dropOverlay = $('#drop-overlay');

  let db = null;
  let activeHistoryId = null;
  let historyEntries = [];
  const historyContentCache = new Map();
  let parsedData = null;
  let parseGeneration = 0;
  let parseWorker = null;

  /* ── Utilities ───────────────────────────────────────────────── */
  function uuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
      const r = (Math.random() * 16) | 0;
      return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
    });
  }

  function formatBytes(bytes) {
    if (bytes === 0) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB'];
    const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
    const val = bytes / Math.pow(1024, i);
    return (i === 0 ? val : val.toFixed(i > 1 ? 1 : 0)) + ' ' + units[i];
  }

  function formatDate(iso) {
    const d = new Date(iso);
    const now = new Date();
    const isToday = d.toDateString() === now.toDateString();
    const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    if (isToday) return 'Today ' + time;
    return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' + time;
  }

  function hideClearConfirm() {
    const confirm = $('#toast-confirm');
    if (!confirm) return;
    confirm.classList.remove('visible');
    confirm.hidden = true;
  }

  function showClearConfirm() {
    const confirm = $('#toast-confirm');
    if (!confirm) return;
    confirm.hidden = false;
    confirm.classList.add('visible');
  }

  function toast(msg, type = 'info') {
    hideClearConfirm();
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    $('#toast-container').appendChild(el);
    setTimeout(() => el.remove(), 3200);
  }

  function byteSize(str) {
    return new Blob([str]).size;
  }

  function entryFileName(entry) {
    return entry.fileName || `${entry.createdAt}_${entry.id.slice(0, 8)}.json`;
  }

  function downloadTextFile(fileName, content) {
    const blob = new Blob([content], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  /* ── IndexedDB storage ───────────────────────────────────────── */
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const database = e.target.result;
        if (!database.objectStoreNames.contains(STORE_HISTORY)) {
          database.createObjectStore(STORE_HISTORY, { keyPath: 'id' });
        }
        if (!database.objectStoreNames.contains(STORE_CONTENT)) {
          database.createObjectStore(STORE_CONTENT, { keyPath: 'id' });
        }
        if (database.objectStoreNames.contains('handles')) {
          database.deleteObjectStore('handles');
        }
      };
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = () => reject(req.error);
    });
  }

  function dbTx(storeNames, mode) {
    return db.transaction(storeNames, mode);
  }

  async function dbGetAllHistory() {
    return new Promise((resolve, reject) => {
      const tx = dbTx(STORE_HISTORY, 'readonly');
      const req = tx.objectStore(STORE_HISTORY).getAll();
      req.onsuccess = () => {
        const items = req.result || [];
        items.sort((a, b) => b.createdAt - a.createdAt);
        resolve(items);
      };
      req.onerror = () => reject(req.error);
    });
  }

  async function dbPutHistory(entry, content) {
    const meta = {
      id: entry.id,
      createdAt: entry.createdAt,
      date: entry.date,
      summary: entry.summary,
      size: entry.size,
      fileName: entry.fileName,
    };
    return new Promise((resolve, reject) => {
      const tx = dbTx([STORE_HISTORY, STORE_CONTENT], 'readwrite');
      tx.objectStore(STORE_HISTORY).put(meta);
      tx.objectStore(STORE_CONTENT).put({ id: entry.id, content });
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function dbDeleteHistory(id) {
    return new Promise((resolve, reject) => {
      const tx = dbTx([STORE_HISTORY, STORE_CONTENT], 'readwrite');
      tx.objectStore(STORE_HISTORY).delete(id);
      tx.objectStore(STORE_CONTENT).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function dbClearHistory() {
    return new Promise((resolve, reject) => {
      const tx = dbTx([STORE_HISTORY, STORE_CONTENT], 'readwrite');
      tx.objectStore(STORE_HISTORY).clear();
      tx.objectStore(STORE_CONTENT).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function readEntryContent(id) {
    return new Promise((resolve, reject) => {
      const tx = dbTx(STORE_CONTENT, 'readonly');
      const req = tx.objectStore(STORE_CONTENT).get(id);
      req.onsuccess = () => resolve(req.result?.content ?? null);
      req.onerror = () => reject(req.error);
    });
  }

  async function buildHistoryContentCache() {
    historyContentCache.clear();
    if (!db) return;
    return new Promise((resolve, reject) => {
      const tx = dbTx(STORE_CONTENT, 'readonly');
      const req = tx.objectStore(STORE_CONTENT).getAll();
      req.onsuccess = () => {
        for (const row of req.result || []) {
          historyContentCache.set(row.id, row.content || '');
        }
        resolve();
      };
      req.onerror = () => reject(req.error);
    });
  }

  function historyEntryMatchesFilter(entry, filter) {
    if (!filter) return true;
    if (entry.summary.toLowerCase().includes(filter)) return true;
    if (entry.date.toLowerCase().includes(filter)) return true;
    if (entry.fileName && entry.fileName.toLowerCase().includes(filter)) return true;
    const content = historyContentCache.get(entry.id);
    return content ? content.toLowerCase().includes(filter) : false;
  }

  async function getTotalCacheSize() {
    const entries = await dbGetAllHistory();
    return entries.reduce((sum, e) => sum + (e.size || 0), 0);
  }

  async function getStorageInfo() {
    const ourUsage = db ? await getTotalCacheSize() : 0;
    let quota = null;
    let originUsage = ourUsage;

    try {
      if (navigator.storage?.estimate) {
        const est = await navigator.storage.estimate();
        if (est.quota && est.quota > 0) quota = est.quota;
        if (typeof est.usage === 'number') originUsage = est.usage;
      }
    } catch (_) { /* ignore */ }

    const effectiveQuota = quota ?? STORAGE_FALLBACK_QUOTA;
    const otherUsage = Math.max(0, originUsage - ourUsage);
    const remaining = Math.max(0, effectiveQuota - originUsage);
    const appBudget = Math.max(0, effectiveQuota - otherUsage);

    return {
      quota: effectiveQuota,
      originUsage,
      ourUsage,
      remaining,
      appBudget,
    };
  }

  async function enforceCacheLimit(excludeId) {
    const info = await getStorageInfo();
    let total = info.ourUsage;
    const limit = info.appBudget;

    if (total <= limit) return;

    const all = await dbGetAllHistory();
    const sorted = all
      .filter((e) => e.id !== excludeId)
      .sort((a, b) => a.createdAt - b.createdAt);

    for (const entry of sorted) {
      if (total <= limit) break;
      await dbDeleteHistory(entry.id);
      total -= entry.size;
    }
  }

  function generateSummary(obj) {
    if (obj === null) return 'null';
    if (Array.isArray(obj)) {
      const preview = obj.slice(0, 3).map((v) => {
        if (v === null) return 'null';
        if (typeof v === 'object') return Array.isArray(v) ? `[${v.length}]` : '{…}';
        return String(v).slice(0, 30);
      });
      const suffix = obj.length > 3 ? ` … +${obj.length - 3} more` : '';
      return `Array[${obj.length}]: [${preview.join(', ')}${suffix}]`;
    }
    if (typeof obj === 'object') {
      const keys = Object.keys(obj);
      const preview = keys.slice(0, 4).map((k) => {
        const v = obj[k];
        let val;
        if (v === null) val = 'null';
        else if (typeof v === 'object') val = Array.isArray(v) ? `[${v.length}]` : '{…}';
        else val = String(v).slice(0, 24);
        return `${k}: ${val}`;
      });
      const suffix = keys.length > 4 ? ` … +${keys.length - 4} keys` : '';
      return `Object{${keys.length}}: { ${preview.join(', ')}${suffix} }`;
    }
    const s = String(obj);
    return s.length > 80 ? s.slice(0, 80) + '…' : s;
  }

  async function saveToHistory(content, parsed) {
    if (!db) return null;

    const size = byteSize(content);
    const now = Date.now();
    const date = new Date().toISOString();
    const summary = generateSummary(parsed);

    const latest = historyEntries[0];
    if (latest) {
      const latestContent = await readEntryContent(latest.id);
      if (latestContent === content) {
        latest.createdAt = now;
        latest.date = date;
        latest.summary = summary;
        latest.size = size;
        await dbPutHistory(latest, content);
        historyContentCache.set(latest.id, content);
        await refreshHistory();
        return latest;
      }
    }

    const entry = {
      id: uuid(),
      createdAt: now,
      date,
      summary,
      size,
    };
    entry.fileName = `${now}_${entry.id.slice(0, 8)}.json`;
    await dbPutHistory(entry, content);
    historyContentCache.set(entry.id, content);
    await enforceCacheLimit(entry.id);

    return entry;
  }

  async function deleteHistoryEntry(id) {
    if (!historyEntries.find((e) => e.id === id)) return;
    await dbDeleteHistory(id);
    if (activeHistoryId === id) activeHistoryId = null;
    await refreshHistory();
  }

  async function clearAllHistory() {
    await dbClearHistory();
    activeHistoryId = null;
    await refreshHistory();
    toast('History cleared', 'success');
  }

  async function downloadHistoryEntry(id) {
    const entry = historyEntries.find((e) => e.id === id);
    if (!entry) return;
    const content = await readEntryContent(id);
    if (!content) {
      toast('Content not found', 'error');
      return;
    }
    downloadTextFile(entryFileName(entry), content);
  }

  async function updateCacheUI() {
    const info = await getStorageInfo();
    const pct = info.quota > 0
      ? Math.min(100, (info.originUsage / info.quota) * 100)
      : 0;
    cacheLabel.textContent = formatBytes(info.ourUsage) + ' / ' + formatBytes(info.quota);
    cacheBarFill.style.width = pct.toFixed(1) + '%';
    if (cacheBadge) {
      cacheBadge.title = 'JSON Studio cache: ' + formatBytes(info.ourUsage)
        + ' · Site storage: ' + formatBytes(info.originUsage) + ' / ' + formatBytes(info.quota)
        + ' (' + formatBytes(info.remaining) + ' left)';
    }
  }

  async function refreshHistory() {
    historyEntries = db ? await dbGetAllHistory() : [];
    await buildHistoryContentCache();
    await updateCacheUI();
    renderHistoryList(historySearch.value.trim().toLowerCase());
  }

  function renderHistoryList(filter) {
    const filtered = filter
      ? historyEntries.filter((e) => historyEntryMatchesFilter(e, filter))
      : historyEntries;

    if (filtered.length === 0) {
      historyList.innerHTML = filter
        ? '<div class="history-empty">No matching history entries.</div>'
        : '<div class="history-empty">Parse JSON to save history locally.</div>';
      return;
    }

    historyList.innerHTML = filtered
      .map(
        (e) => `
      <div class="history-item${e.id === activeHistoryId ? ' active' : ''}" data-id="${e.id}">
        <div class="history-actions">
          <button class="history-action" data-download="${e.id}" title="Download JSON">↓</button>
          <button class="history-action danger" data-delete="${e.id}" title="Delete">×</button>
        </div>
        <div class="history-date">${formatDate(e.date)}</div>
        <div class="history-summary">${escapeHtml(e.summary)}</div>
        <div class="history-meta">
          <span>${formatBytes(e.size)}</span>
          <span title="${escapeHtml(e.fileName || '')}">${escapeHtml(e.fileName || '')}</span>
        </div>
      </div>`
      )
      .join('');
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ── JSON parsing (worker + relaxed fallback) ────────────────── */
  function createParseWorker() {
    const src = [
      'self.onmessage=function(e){',
      'var m=e.data,id=m.id,text=m.text,shouldFormat=m.shouldFormat;',
      'try{',
      'var data=JSON.parse(text);',
      'var out={id:id,ok:true,data:data};',
      'if(shouldFormat)out.formatted=JSON.stringify(data,null,2);',
      'self.postMessage(out);',
      '}catch(err){',
      'self.postMessage({id:id,ok:false,error:err.message});',
      '}',
      '};',
    ].join('');
    return new Worker(URL.createObjectURL(new Blob([src], { type: 'application/javascript' })));
  }

  function parseJsonSync(text) {
    try {
      return { ok: true, data: JSON.parse(text) };
    } catch (_) {
      try {
        return { ok: true, data: Function('"use strict"; return (' + text + ')')() };
      } catch (err) {
        return { ok: false, error: err.message };
      }
    }
  }

  function parseInWorker(text, shouldFormat, generation) {
    return new Promise((resolve) => {
      if (!parseWorker) parseWorker = createParseWorker();
      const handler = (e) => {
        if (e.data.id !== generation) return;
        parseWorker.removeEventListener('message', handler);
        resolve(e.data);
      };
      parseWorker.addEventListener('message', handler);
      parseWorker.postMessage({ id: generation, text, shouldFormat });
    });
  }

  function getViewerOptions() {
    return {
      collapsed: $('#opt-collapsed').checked,
      rootCollapsable: $('#opt-root-collapsable').checked,
      withQuotes: $('#opt-with-quotes').checked,
      withLinks: $('#opt-with-links').checked,
    };
  }

  /* ── Lazy JSON tree (Cursor / VS Code style) ─────────────────── */
  const lazyNodeData = new WeakMap();

  function isCollapsable(value) {
    return value !== null && typeof value === 'object' && (
      Array.isArray(value) ? value.length > 0 : Object.keys(value).length > 0
    );
  }

  function countChildren(value) {
    if (Array.isArray(value)) return value.length;
    if (value && typeof value === 'object') return Object.keys(value).length;
    return 0;
  }

  function childLabel(value, count) {
    if (Array.isArray(value)) return count === 1 ? '1 item' : count + ' items';
    return count === 1 ? '1 key' : count + ' keys';
  }

  function shouldAutoExpand(value, options) {
    if (options.collapsed || !isCollapsable(value)) return false;
    return countChildren(value) <= AUTO_EXPAND_MAX_CHILDREN;
  }

  function populateCollectionOutline(list, value, depth, options, onDone) {
    const total = countChildren(value);
    if (total > DOM_BATCH_SIZE) {
      parseStatus.innerHTML = '<span style="color:var(--accent)">Building outline…</span>';
      populateCollectionListBatched(list, value, depth, options, 0, onDone || updateParseStatusAfterTree);
    } else {
      populateCollectionList(list, value, depth, options);
      if (onDone) onDone();
    }
  }

  function isUrl(string) {
    return string.length <= MAX_LINKIFY_LENGTH
      && /^(https?:\/\/|ftps?:\/\/)[^\s/$.?#][^\s]*$/i.test(string);
  }

  function renderEmptyCollection(value) {
    const span = document.createElement('span');
    span.textContent = Array.isArray(value) ? '[]' : '{}';
    return span;
  }

  function renderPrimitive(value, options) {
    const span = document.createElement('span');
    if (typeof value === 'string') {
      const display = value.length > MAX_STRING_DISPLAY
        ? value.slice(0, MAX_STRING_DISPLAY) + '…'
        : value;
      if (options.withLinks && isUrl(value)) {
        const a = document.createElement('a');
        a.href = value;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.className = 'json-link json-string';
        a.textContent = '"' + display + '"';
        return a;
      }
      span.className = 'json-string';
      span.textContent = '"' + display + '"';
      return span;
    }
    if (typeof value === 'number') {
      span.className = 'json-number';
      span.textContent = String(value);
    } else if (typeof value === 'boolean') {
      span.className = 'json-literal';
      span.textContent = String(value);
    } else {
      span.className = 'json-literal';
      span.textContent = 'null';
    }
    return span;
  }

  function createToggleButton(collapsed) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'json-toggle' + (collapsed ? ' collapsed' : '');
    return btn;
  }

  function createKeyElement(key, options, collapsable, collapsed = true) {
    const label = options.withQuotes ? '"' + key + '"' : key;
    if (collapsable) {
      const toggle = createToggleButton(collapsed);
      const keySpan = document.createElement('span');
      keySpan.className = 'json-key';
      keySpan.textContent = label;
      toggle.appendChild(keySpan);
      return toggle;
    }
    const keySpan = document.createElement('span');
    keySpan.className = 'json-key';
    keySpan.textContent = label;
    return keySpan;
  }

  function createPlaceholder(count, value) {
    const ph = document.createElement('button');
    ph.type = 'button';
    ph.className = 'json-placeholder';
    ph.textContent = childLabel(value, count);
    return ph;
  }

  function createCollectionShell(value) {
    const shell = document.createElement('span');
    shell.className = 'json-collection';
    const isArray = Array.isArray(value);
    const open = document.createElement('span');
    open.className = 'json-bracket-open';
    open.textContent = isArray ? '[' : '{';
    const close = document.createElement('span');
    close.className = 'json-bracket-close';
    close.textContent = isArray ? ']' : '}';
    shell.appendChild(open);
    shell.appendChild(close);
    return shell;
  }

  function setCollectionExpanded(shell, expanded) {
    if (!shell) return;
    shell.classList.toggle('is-expanded', expanded);
  }

  function insertIntoCollectionShell(shell, node) {
    shell.insertBefore(node, shell.lastChild);
  }

  function appendListToShell(shell, list) {
    const wrap = document.createElement('span');
    wrap.className = 'json-value-block';
    wrap.appendChild(list);
    insertIntoCollectionShell(shell, wrap);
    return wrap;
  }

  function removeLiTrailingComma(li) {
    li?.querySelectorAll(':scope > .json-trailing-comma').forEach((el) => el.remove());
  }

  function setShellTrailingComma(shell, expanded, addComma) {
    if (!shell) return;
    removeLiTrailingComma(shell.parentElement);

    const closeLine = shell.querySelector(':scope > .json-close-line');
    let close = shell.querySelector(':scope > .json-bracket-close');
    if (closeLine) {
      close = closeLine.querySelector('.json-bracket-close');
      if (close) closeLine.replaceWith(close);
    }
    shell.querySelectorAll(':scope > .json-trailing-comma').forEach((el) => el.remove());

    if (!close || !addComma) return;

    if (expanded) {
      const wrap = document.createElement('span');
      wrap.className = 'json-close-line';
      close.replaceWith(wrap);
      wrap.appendChild(close);
      const comma = document.createElement('span');
      comma.className = 'json-trailing-comma';
      comma.textContent = ',';
      wrap.appendChild(comma);
    } else {
      const comma = document.createElement('span');
      comma.className = 'json-trailing-comma';
      comma.textContent = ',';
      shell.appendChild(comma);
    }
  }

  function getCollectionShell(holder) {
    return holder.querySelector(':scope > .json-collection');
  }

  function collectionBracketChars(value) {
    return Array.isArray(value) ? ['[', ']'] : ['{', '}'];
  }

  function appendCloseSuffix(parent, value, addComma) {
    const closeCh = collectionBracketChars(value)[1];
    if (addComma) {
      const closeLine = document.createElement('span');
      closeLine.className = 'json-close-line';
      const close = document.createElement('span');
      close.className = 'json-bracket-close';
      close.textContent = closeCh;
      closeLine.appendChild(close);
      const comma = document.createElement('span');
      comma.className = 'json-trailing-comma';
      comma.textContent = ',';
      closeLine.appendChild(comma);
      parent.appendChild(closeLine);
      return closeLine;
    }
    const close = document.createElement('span');
    close.className = 'json-bracket-close';
    close.textContent = closeCh;
    parent.appendChild(close);
    return close;
  }

  function mountFlatCollection(li, value, depth, options, addComma, shouldExpand, toggle) {
    const openCh = collectionBracketChars(value)[0];
    const isArray = Array.isArray(value);

    if (shouldExpand) {
      const head = ensureFlatHead(li);
      const open = document.createElement('span');
      open.className = 'json-bracket-open';
      open.textContent = openCh;
      getListInsertPoint(li, toggle).after(open);

      const list = document.createElement(isArray ? 'ol' : 'ul');
      list.className = isArray ? 'json-array' : 'json-dict';
      head.after(list);
      appendCloseSuffix(li, value, addComma);
      populateCollectionList(list, value, depth + 1, options);

      lazyNodeData.set(li, {
        value, depth, options, built: true, list, addComma, flatLayout: true,
        toggle: toggle || null, openBracket: open,
      });
    } else {
      ensureFlatHead(li);
      const shell = createCollectionShell(value);
      insertIntoCollectionShell(shell, createPlaceholder(countChildren(value), value));
      getListInsertPoint(li, toggle).after(shell);
      if (addComma) setShellTrailingComma(shell, false, true);
      lazyNodeData.set(li, {
        value, depth, options, built: false, list: null, addComma, flatLayout: true,
        collectionShell: shell, toggle: toggle || null,
      });
    }
  }

  function getValueBlock(list) {
    return list.closest('.json-value-block') || list;
  }

  function populateCollectionList(list, value, depth, options) {
    if (Array.isArray(value)) {
      for (let i = 0; i < value.length; i++) {
        const li = document.createElement('li');
        appendValueToLi(li, value[i], depth, options, i < value.length - 1);
        list.appendChild(li);
      }
      return;
    }

    const keys = Object.keys(value);
    for (let i = 0; i < keys.length; i++) {
      const key = keys[i];
      const li = document.createElement('li');
      appendKeyedValueToLi(li, key, value[key], depth, options, i < keys.length - 1);
      list.appendChild(li);
    }
  }

  function populateCollectionListBatched(list, value, depth, options, startIndex, onDone) {
    const isArray = Array.isArray(value);
    const keys = isArray ? null : Object.keys(value);
    const total = countChildren(value);
    let index = startIndex;

    function batch() {
      const end = Math.min(index + DOM_BATCH_SIZE, total);
      for (; index < end; index++) {
        const li = document.createElement('li');
        if (isArray) {
          appendValueToLi(li, value[index], depth, options, index < total - 1);
        } else {
          appendKeyedValueToLi(li, keys[index], value[keys[index]], depth, options, index < total - 1);
        }
        list.appendChild(li);
      }
      if (index < total) {
        requestAnimationFrame(batch);
      } else {
        onDone();
      }
    }
    requestAnimationFrame(batch);
  }

  function appendValueToLi(li, value, depth, options, addComma) {
    if (value !== null && typeof value === 'object') {
      if (isCollapsable(value)) {
        const shouldExpand = shouldAutoExpand(value, options);
        li.classList.add('json-flat-value');
        const toggle = createToggleButton(!shouldExpand);
        const prefix = document.createElement('span');
        prefix.className = 'json-flat-prefix';
        prefix.appendChild(toggle);
        li.appendChild(prefix);
        mountFlatCollection(li, value, depth, options, addComma, shouldExpand, toggle);
      } else {
        li.appendChild(renderEmptyCollection(value));
        if (addComma) li.appendChild(document.createTextNode(','));
      }
    } else {
      li.appendChild(renderPrimitive(value, options));
      if (addComma) li.appendChild(document.createTextNode(','));
    }
  }

  function appendKeyedValueToLi(li, key, value, depth, options, addComma) {
    const isObject = value !== null && typeof value === 'object';
    const collapsable = isObject && isCollapsable(value);
    const shouldExpand = collapsable && shouldAutoExpand(value, options);
    if (collapsable) li.classList.add('json-flat-value');
    const toggle = createKeyElement(key, options, collapsable, !shouldExpand);
    const prefix = document.createElement('span');
    prefix.className = 'json-flat-prefix';
    prefix.appendChild(toggle);
    prefix.appendChild(document.createTextNode(': '));
    li.appendChild(prefix);

    if (collapsable) {
      mountFlatCollection(li, value, depth, options, addComma, shouldExpand, toggle);
    } else if (isObject) {
      li.appendChild(renderEmptyCollection(value));
      if (addComma) li.appendChild(document.createTextNode(','));
    } else {
      li.appendChild(renderPrimitive(value, options));
      if (addComma) li.appendChild(document.createTextNode(','));
    }
  }

  function buildRootCollectionShell(container, value, options) {
    const isArray = Array.isArray(value);
    const count = countChildren(value);
    const shouldExpand = shouldAutoExpand(value, options);
    const toggle = createToggleButton(!shouldExpand);
    toggle.classList.add('json-root-toggle');
    container.classList.add('json-root-flat');
    container.appendChild(toggle);

    if (shouldExpand) {
      const open = document.createElement('span');
      open.className = 'json-bracket-open';
      open.textContent = collectionBracketChars(value)[0];
      container.appendChild(open);

      const list = document.createElement(isArray ? 'ol' : 'ul');
      list.className = isArray ? 'json-array' : 'json-dict';
      container.appendChild(list);
      appendCloseSuffix(container, value, false);

      populateCollectionOutline(list, value, 1, options, updateParseStatusAfterTree);
      lazyNodeData.set(container, {
        value, depth: 0, options, built: true, list, isRoot: true, toggle, openBracket: open,
        flatLayout: true,
      });
    } else {
      const shell = createCollectionShell(value);
      insertIntoCollectionShell(shell, createPlaceholder(count, value));
      container.appendChild(shell);
      lazyNodeData.set(container, {
        value, depth: 0, options, built: false, list: null, isRoot: true, toggle,
        collectionShell: shell, flatLayout: true,
      });
    }
  }

  function resolveHolderToggle(holder) {
    if (!holder) return null;
    const meta = lazyNodeData.get(holder);
    return meta?.toggle
      || holder.querySelector(':scope > .json-flat-prefix .json-toggle, :scope > .json-flat-head .json-toggle')
      || holder.querySelector(':scope > .json-toggle');
  }

  function ensureFlatHead(holder) {
    if (isRootContentHolder(holder)) return null;
    let head = holder.querySelector(':scope > .json-flat-head');
    if (!head) {
      head = document.createElement('div');
      head.className = 'json-flat-head';
      const prefix = holder.querySelector(':scope > .json-flat-prefix');
      if (prefix) {
        prefix.before(head);
        head.appendChild(prefix);
      } else {
        holder.prepend(head);
      }
    }
    return head;
  }

  function repairRootFlatDom(holder, meta, toggle) {
    holder.querySelector(':scope > .json-flat-head')?.remove();

    const activeToggle = meta.toggle || toggle || resolveHolderToggle(holder);
    const list = meta.list;
    const open = meta.openBracket;

    if (activeToggle && holder.firstElementChild !== activeToggle) {
      holder.prepend(activeToggle);
    }

    if (open?.parentNode && activeToggle && open.previousElementSibling !== activeToggle) {
      activeToggle.after(open);
    }

    if (list && open && (list.previousElementSibling !== open || !list.isConnected)) {
      open.after(list);
    }
  }

  function getListInsertPoint(holder, toggle) {
    const activeToggle = toggle || resolveHolderToggle(holder);
    if (!activeToggle) return ensureFlatHead(holder);
    const prefix = activeToggle.closest('.json-flat-prefix');
    if (prefix && holder.contains(prefix)) return prefix;
    const next = activeToggle.nextSibling;
    if (next && next.nodeType === Node.TEXT_NODE && next.textContent === ': ') {
      return next;
    }
    return activeToggle;
  }

  function expandLazyNode(holder, toggle) {
    const meta = lazyNodeData.get(holder);
    if (!meta || meta.built) return false;

    const isArray = Array.isArray(meta.value);
    const list = document.createElement(isArray ? 'ol' : 'ul');
    list.className = isArray ? 'json-array' : 'json-dict';
    meta.built = true;
    meta.list = list;

    const activeToggle = meta.toggle || toggle;
    const shell = meta.collectionShell || getCollectionShell(holder);
    const placeholder = shell?.querySelector('.json-placeholder')
      || holder.querySelector(':scope > .json-placeholder');
    const total = countChildren(meta.value);

    if (activeToggle) activeToggle.classList.remove('collapsed');

    if (meta.flatLayout) {
      showFlatExpanded(holder, meta, activeToggle);
    } else if (shell) {
      if (placeholder) placeholder.remove();
      appendListToShell(shell, list);
      setCollectionExpanded(shell, true);
      if (meta.addComma) setShellTrailingComma(shell, true, true);
      if (!shell.parentNode) {
        getListInsertPoint(holder, activeToggle).after(shell);
      }
    } else {
      getListInsertPoint(holder, activeToggle).after(list);
      if (placeholder) placeholder.remove();
    }

    const liveOptions = getViewerOptions();
    meta.options = liveOptions;

    if (total > DOM_BATCH_SIZE) {
      parseStatus.innerHTML = '<span style="color:var(--accent)">Expanding ' + total + ' items…</span>';
      populateCollectionListBatched(list, meta.value, meta.depth + 1, liveOptions, 0, updateParseStatusAfterTree);
    } else {
      populateCollectionList(list, meta.value, meta.depth + 1, liveOptions);
    }
    return true;
  }

  function removeFlatExpandedChrome(holder, meta) {
    meta?.openBracket?.remove();
    if (meta) meta.openBracket = null;
    holder.querySelectorAll(':scope > .json-close-line, :scope > .json-bracket-close').forEach((el) => el.remove());
    if (meta?.list) meta.list.style.display = 'none';
  }

  function showFlatExpanded(holder, meta, toggle) {
    meta.collectionShell?.remove();
    meta.collectionShell = null;

    const list = meta.list;
    if (!list) return;

    list.style.display = '';

    if (isRootContentHolder(holder)) {
      const activeToggle = meta.toggle || toggle || resolveHolderToggle(holder);
      let open = meta.openBracket;
      if (!open?.parentNode) {
        open = document.createElement('span');
        open.className = 'json-bracket-open';
        open.textContent = collectionBracketChars(meta.value)[0];
        meta.openBracket = open;
        if (activeToggle) activeToggle.after(open);
        else holder.prepend(open);
      }
      repairRootFlatDom(holder, meta, toggle);
      if (list && open && !list.isConnected) open.after(list);
      holder.querySelectorAll(':scope > .json-close-line, :scope > .json-bracket-close').forEach((el) => el.remove());
      appendCloseSuffix(holder, meta.value, meta.addComma);
      return;
    }

    const head = ensureFlatHead(holder);
    let open = meta.openBracket;
    if (!open?.parentNode) {
      open = document.createElement('span');
      open.className = 'json-bracket-open';
      open.textContent = collectionBracketChars(meta.value)[0];
      meta.openBracket = open;
      getListInsertPoint(holder, toggle).after(open);
    } else if (head && !head.contains(open)) {
      getListInsertPoint(holder, toggle).after(open);
    }

    if (head) {
      if (!list.isConnected || list.parentNode !== holder || list.previousElementSibling !== head) {
        head.after(list);
      }
    } else {
      const anchor = getListInsertPoint(holder, toggle);
      if (!list.isConnected || list.parentNode !== holder || list.previousElementSibling !== anchor) {
        anchor.after(list);
      }
    }

    holder.querySelectorAll(':scope > .json-close-line, :scope > .json-bracket-close').forEach((el) => el.remove());
    appendCloseSuffix(holder, meta.value, meta.addComma);
  }

  function collapseFlatLayout(holder, meta, toggle) {
    const count = countChildren(meta.value);

    removeFlatExpandedChrome(holder, meta);

    meta.collectionShell?.remove();
    const shell = createCollectionShell(meta.value);
    insertIntoCollectionShell(shell, createPlaceholder(count, meta.value));

    if (isRootContentHolder(holder)) {
      holder.querySelector(':scope > .json-flat-head')?.remove();
      const activeToggle = meta.toggle || toggle || resolveHolderToggle(holder);
      if (activeToggle) activeToggle.after(shell);
      else holder.appendChild(shell);
    } else {
      ensureFlatHead(holder);
      getListInsertPoint(holder, toggle).after(shell);
    }

    if (meta.addComma) setShellTrailingComma(shell, false, true);
    meta.collectionShell = shell;
  }

  function showBuiltNode(holder, toggle) {
    const meta = lazyNodeData.get(holder);
    const list = meta?.list || holder.querySelector(':scope > ul.json-dict, :scope > ol.json-array');
    if (!list) return;
    const activeToggle = (toggle?.isConnected ? toggle : null) || resolveHolderToggle(holder);
    activeToggle?.classList.remove('collapsed');
    holder.querySelector(':scope > .json-suffix')?.remove();

    if (meta?.flatLayout) {
      showFlatExpanded(holder, meta, activeToggle);
      if (list.childElementCount === 0 && meta.value != null && isCollapsable(meta.value)) {
        const liveOptions = getViewerOptions();
        meta.options = liveOptions;
        populateCollectionList(list, meta.value, meta.depth + 1, liveOptions);
      }
      return;
    }

    const block = getValueBlock(list);
    block.style.display = '';
    const shell = meta?.collectionShell || getCollectionShell(holder);
    setCollectionExpanded(shell, true);
    if (meta?.addComma) setShellTrailingComma(shell, true, true);
    shell?.querySelector('.json-placeholder')?.remove();
    const placeholder = holder.querySelector(':scope > .json-placeholder');
    if (placeholder) {
      const next = placeholder.nextSibling;
      if (next?.nodeType === Node.TEXT_NODE && next.textContent === ',') {
        next.remove();
      }
      placeholder.remove();
    }
  }

  function collapseNode(holder, toggle) {
    const meta = lazyNodeData.get(holder);
    const list = meta?.list || holder.querySelector(':scope > ul.json-dict, :scope > ol.json-array');
    if (!list && !meta?.flatLayout) return;
    toggle.classList.add('collapsed');
    holder.querySelector(':scope > .json-suffix')?.remove();

    const count = meta ? countChildren(meta.value) : countChildren([]);
    const val = meta ? meta.value : [];

    if (meta?.flatLayout) {
      collapseFlatLayout(holder, meta, toggle);
      return;
    }

    if (!list) return;

    const block = getValueBlock(list);
    block.style.display = 'none';
    const shell = meta?.collectionShell || getCollectionShell(holder);
    setCollectionExpanded(shell, false);
    let placeholder = shell?.querySelector('.json-placeholder')
      || holder.querySelector(':scope > .json-placeholder');
    if (placeholder) {
      placeholder.textContent = childLabel(val, count);
    } else if (shell) {
      insertIntoCollectionShell(shell, createPlaceholder(count, val));
    } else {
      placeholder = createPlaceholder(count, val);
      block.after(placeholder);
    }
    if (shell && meta?.addComma) setShellTrailingComma(shell, false, true);
  }

  function updateParseStatusAfterTree() {
    parseStatus.innerHTML = '<span style="color:var(--success)">✓ Valid JSON</span>';
  }

  function renderTreeLazy(json, options) {
    jsonRenderer.innerHTML = '';
    jsonRenderer.classList.add('json-document');

    const root = document.createElement('div');
    root.className = 'json-root';

    if (!isCollapsable(json)) {
      root.appendChild(renderPrimitive(json, options));
    } else {
      if (options.rootCollapsable) {
        const outerToggle = createToggleButton(true);
        root.appendChild(outerToggle);

        const inner = document.createElement('div');
        inner.className = 'json-root-inner';
        buildRootCollectionShell(inner, json, options);
        inner.style.display = 'none';
        root.appendChild(inner);

        lazyNodeData.set(root, {
          value: json,
          depth: 0,
          options,
          built: true,
          list: inner,
          isRoot: true,
          toggle: outerToggle,
          isOuterRoot: true,
        });
      } else {
        buildRootCollectionShell(root, json, options);
      }
    }

    jsonRenderer.appendChild(root);
  }

  function eventFind(e, selector) {
    const path = typeof e.composedPath === 'function' ? e.composedPath() : [];
    return path.find((el) => el instanceof Element && el.matches(selector)) || null;
  }

  const TREE_GUTTER_PX = 28;

  function resolveLazyHolder(fromEl) {
    let el = fromEl;
    while (el && el !== jsonRenderer) {
      if (lazyNodeData.has(el)) return el;
      el = el.parentElement;
    }
    return fromEl.parentElement;
  }

  function isRootContentHolder(holder) {
    if (!holder) return false;
    const meta = lazyNodeData.get(holder);
    if (meta?.isRoot && !meta?.isOuterRoot) return true;
    return holder.classList.contains('json-root') || holder.classList.contains('json-root-inner');
  }

  function isRootCollectionList(list) {
    const shell = list.closest('.json-collection');
    if (!shell) return false;
    return isRootContentHolder(shell.parentElement);
  }

  function resolveRootTreeToggle(fromEl) {
    const holder = resolveLazyHolder(fromEl);
    if (!isRootContentHolder(holder)) return null;
    const meta = lazyNodeData.get(holder);
    const toggle = meta?.toggle || holder.querySelector(':scope > .json-toggle.json-root-toggle');
    return toggle ? { holder, toggle } : null;
  }

  function applyTreeToggle(holder, toggle) {
    const meta = lazyNodeData.get(holder);
    const isCollapsed = toggle.classList.contains('collapsed');

    if (meta?.isOuterRoot) {
      if (isCollapsed) {
        meta.list.style.display = '';
        toggle.classList.remove('collapsed');
      } else {
        meta.list.style.display = 'none';
        toggle.classList.add('collapsed');
      }
      return;
    }

    if (isCollapsed) {
      if (!meta || !meta.built) expandLazyNode(holder, toggle);
      else showBuiltNode(holder, toggle);
    } else {
      collapseNode(holder, toggle);
    }
  }

  function findLiToggleInListGutter(list, clientY) {
    const items = list.querySelectorAll(':scope > li');
    for (const li of items) {
      const rect = li.getBoundingClientRect();
      if (clientY >= rect.top && clientY <= rect.bottom) {
        const toggle = resolveHolderToggle(li);
        if (toggle) return { holder: li, toggle };
      }
    }
    return null;
  }

  function resolveTreeToggleTarget(e) {
    if (eventFind(e, 'a.json-link')) return null;

    const toggle = eventFind(e, '.json-toggle');
    if (toggle) {
      return { holder: resolveLazyHolder(toggle), toggle };
    }

    const placeholder = eventFind(e, '.json-placeholder');
    if (placeholder) {
      const rootTarget = resolveRootTreeToggle(placeholder);
      if (rootTarget) return rootTarget;
      const holder = resolveLazyHolder(placeholder);
      const phToggle = resolveHolderToggle(holder);
      return phToggle ? { holder, toggle: phToggle } : null;
    }

    if (e.clientX == null || e.clientY == null) return null;

    const list = eventFind(e, 'ul.json-dict, ol.json-array');
    if (list) {
      if (isRootCollectionList(list)) return null;
      const listRect = list.getBoundingClientRect();
      if (e.clientX - listRect.left <= TREE_GUTTER_PX) {
        return findLiToggleInListGutter(list, e.clientY);
      }
    }

    const li = eventFind(e, 'li');
    if (li) {
      if (isRootCollectionList(li.parentElement)) return null;
      const liRect = li.getBoundingClientRect();
      if (e.clientX - liRect.left <= TREE_GUTTER_PX) {
        const liToggle = resolveHolderToggle(li);
        if (liToggle) return { holder: li, toggle: liToggle };
      }
    }

    return null;
  }

  function handleTreeClick(e) {
    const target = resolveTreeToggleTarget(e);
    if (!target?.toggle) return;
    e.preventDefault();
    applyTreeToggle(target.holder, target.toggle);
  }

  jsonRenderer.addEventListener('click', handleTreeClick);

  async function parseAndRender(saveHistory = true) {
    const text = jsonInput.value.trim();
    if (!text) {
      parsedData = null;
      jsonRenderer.innerHTML = '';
      parseStatus.textContent = '';
      inputStats.textContent = '';
      return;
    }

    const size = byteSize(text);
    const generation = ++parseGeneration;
    parseStatus.innerHTML = '<span style="color:var(--accent)">Parsing…</span>';
    inputStats.textContent = formatBytes(size);

    let result;
    if (size >= PARSE_WORKER_THRESHOLD) {
      result = await parseInWorker(text, true, generation);
      if (!result.ok) {
        result = parseJsonSync(text);
        if (result.ok) result.formatted = JSON.stringify(result.data, null, 2);
      }
    } else {
      result = parseJsonSync(text);
      if (result.ok) result.formatted = JSON.stringify(result.data, null, 2);
    }

    if (generation !== parseGeneration) return;

    if (!result.ok) {
      parsedData = null;
      parseStatus.innerHTML = '<span style="color:var(--danger)">✕ ' + escapeHtml(result.error) + '</span>';
      jsonRenderer.innerHTML = '';
      return;
    }

    parsedData = result.data;
    const contentForHistory = result.formatted || text;

    if (result.formatted) {
      jsonInput.value = result.formatted;
    }

    const options = getViewerOptions();
    renderTreeLazy(result.data, options);

    parseStatus.innerHTML = '<span style="color:var(--success)">✓ Valid JSON</span>';
    inputStats.textContent = formatBytes(byteSize(jsonInput.value));

    if (saveHistory && db) {
      try {
        const entry = await saveToHistory(contentForHistory, result.data);
        if (entry) {
          activeHistoryId = entry.id;
          await refreshHistory();
        }
      } catch (err) {
        console.error('History save failed:', err);
        toast('Failed to save history', 'error');
      }
    }

    syncPortraitInputHeight();
  }

  async function minifyJson() {
    const text = jsonInput.value.trim();
    if (!text) return;

    let result;
    if (byteSize(text) >= PARSE_WORKER_THRESHOLD) {
      const generation = ++parseGeneration;
      result = await parseInWorker(text, false, generation);
      if (!result.ok) result = parseJsonSync(text);
    } else {
      result = parseJsonSync(text);
    }

    if (!result.ok) {
      toast('Invalid JSON: ' + result.error, 'error');
      return;
    }
    parsedData = result.data;
    jsonInput.value = JSON.stringify(result.data);
    toast('Minified', 'success');
    renderTreeLazy(result.data, getViewerOptions());
    updateParseStatusAfterTree();
    syncPortraitInputHeight();
  }

  async function copyJson() {
    try {
      await navigator.clipboard.writeText(jsonInput.value);
      toast('Copied to clipboard', 'success');
    } catch {
      toast('Copy failed', 'error');
    }
  }

  async function loadFromHistory(id) {
    const entry = historyEntries.find((e) => e.id === id);
    if (!entry) return;

    const content = await readEntryContent(id);
    if (!content) {
      await deleteHistoryEntry(id);
      toast('Entry was missing and has been removed', 'info');
      return;
    }

    activeHistoryId = id;
    jsonInput.value = content;
    await parseAndRender(false);
    renderHistoryList(historySearch.value.trim().toLowerCase());
  }

  function handleFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      jsonInput.value = e.target.result;
      parseAndRender(true);
    };
    reader.onerror = () => toast('Failed to read file', 'error');
    reader.readAsText(file);
  }

  /* ── Event bindings ──────────────────────────────────────────── */
  $('#btn-parse').addEventListener('click', () => parseAndRender(true));
  $('#btn-minify').addEventListener('click', minifyJson);
  $('#btn-copy').addEventListener('click', copyJson);
  $('#btn-upload').addEventListener('click', () => $('#file-input').click());
  $('#file-input').addEventListener('change', (e) => handleFile(e.target.files[0]));
  $('#btn-clear-history').addEventListener('click', showClearConfirm);
  $('#toast-confirm-cancel')?.addEventListener('click', hideClearConfirm);
  $('#toast-confirm-ok')?.addEventListener('click', () => {
    hideClearConfirm();
    clearAllHistory();
  });
  const MOBILE_MQ = window.matchMedia('(max-width: 768px)');
  const STACKED_MQ = window.matchMedia('(max-width: 1100px)');
  const LANDSCAPE_STACKED_MQ = window.matchMedia('(max-width: 1100px) and (orientation: landscape)');

  function isMobileLayout() {
    return MOBILE_MQ.matches;
  }

  function isHistoryToastLayout() {
    return LANDSCAPE_STACKED_MQ.matches;
  }

  function isHistoryOverlayLayout() {
    return STACKED_MQ.matches;
  }

  function setMobileSidebarOpen(open) {
    const sidebar = $('#sidebar');
    const backdrop = $('#sidebar-backdrop');
    if (!sidebar) return;
    sidebar.classList.toggle('open', open);
    if (backdrop) {
      backdrop.classList.toggle('visible', open);
      backdrop.toggleAttribute('hidden', !open);
    }
  }

  function updateHeaderOffset() {
    const header = document.querySelector('.header');
    if (!header) return;
    document.documentElement.style.setProperty('--header-offset', header.offsetHeight + 'px');
  }

  function initMobileLayout() {
    updateHeaderOffset();
    window.addEventListener('resize', updateHeaderOffset);
    if (typeof ResizeObserver !== 'undefined') {
      const header = document.querySelector('.header');
      if (header) new ResizeObserver(updateHeaderOffset).observe(header);
    }
    $('#sidebar-backdrop')?.addEventListener('click', () => setMobileSidebarOpen(false));

    MOBILE_MQ.addEventListener('change', () => {
      if (!isHistoryOverlayLayout()) setMobileSidebarOpen(false);
    });
    LANDSCAPE_STACKED_MQ.addEventListener('change', () => {
      if (!isHistoryOverlayLayout()) setMobileSidebarOpen(false);
    });
  }

  $('#btn-history-toggle').addEventListener('click', () => {
    if (isHistoryOverlayLayout()) {
      const sidebar = $('#sidebar');
      setMobileSidebarOpen(!sidebar?.classList.contains('open'));
    } else {
      toggleSidebarCollapsed();
    }
  });

  historySearch.addEventListener('input', () => {
    renderHistoryList(historySearch.value.trim().toLowerCase());
  });

  historyList.addEventListener('click', async (e) => {
    const downloadBtn = e.target.closest('[data-download]');
    if (downloadBtn) {
      e.stopPropagation();
      await downloadHistoryEntry(downloadBtn.dataset.download);
      return;
    }
    const delBtn = e.target.closest('[data-delete]');
    if (delBtn) {
      e.stopPropagation();
      deleteHistoryEntry(delBtn.dataset.delete);
      toast('Entry removed', 'info');
      return;
    }
    const item = e.target.closest('[data-id]');
    if (item) {
      loadFromHistory(item.dataset.id);
      if (isHistoryOverlayLayout()) setMobileSidebarOpen(false);
    }
  });

  document.querySelectorAll('.options-bar input').forEach((el) => {
    el.addEventListener('change', () => {
      if (parsedData) {
        const options = getViewerOptions();
        if (!options.collapsed && countChildren(parsedData) > DOM_BATCH_SIZE) {
          parseStatus.innerHTML = '<span style="color:var(--accent)">Building outline…</span>';
        }
        renderTreeLazy(parsedData, options);
        if (options.collapsed || countChildren(parsedData) <= DOM_BATCH_SIZE) {
          updateParseStatusAfterTree();
        }
      } else if (jsonInput.value.trim()) {
        parseAndRender(false);
      }
    });
  });

  /* Drag & drop */
  ['dragenter', 'dragover'].forEach((evt) => {
    document.addEventListener(evt, (e) => {
      e.preventDefault();
      dropOverlay.classList.add('visible');
    });
  });

  ['dragleave', 'drop'].forEach((evt) => {
    document.addEventListener(evt, (e) => {
      e.preventDefault();
      if (evt === 'dragleave' && e.relatedTarget) return;
      dropOverlay.classList.remove('visible');
    });
  });

  document.addEventListener('drop', (e) => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  /* Keyboard shortcut */
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      parseAndRender(true);
    }
  });

  /* ── Resizable input / tree split ────────────────────────────── */
  const LAYOUT_KEY = 'json-studio-layout';
  const PANE_RATIO_KEY = 'json-studio-input-pane-ratio'; // legacy
  const SIDEBAR_COLLAPSED_KEY = 'json-studio-sidebar-collapsed';
  const THEME_KEY = 'json-studio-theme';
  const PANE_MIN_PX = 160;
  const PANE_MIN_PX_STACKED = 200;
  const LAYOUT_PRESETS = {
    tree: 0.15,
    balanced: 0.5,
    input: 0.85,
  };

  let workspaceLayoutMode = 'split';
  let workspaceSplitRatio = LAYOUT_PRESETS.balanced;

  function workspaceIsStacked() {
    return STACKED_MQ.matches;
  }

  function isContentScrollLayout() {
    return STACKED_MQ.matches;
  }

  function syncPortraitInputHeight() {
    if (!jsonInput) return;
    if (!isContentScrollLayout()) {
      jsonInput.style.height = '';
      return;
    }
    jsonInput.style.height = 'auto';
    jsonInput.style.height = jsonInput.scrollHeight + 'px';
  }

  function initPortraitContentScroll() {
    const onChange = () => syncPortraitInputHeight();
    STACKED_MQ.addEventListener('change', onChange);
    LANDSCAPE_STACKED_MQ.addEventListener('change', onChange);
    jsonInput?.addEventListener('input', onChange);
    onChange();
  }

  function getInputPaneRatio() {
    const workspace = $('#workspace');
    if (!workspace) return workspaceSplitRatio;
    const raw = getComputedStyle(workspace).getPropertyValue('--input-pane-size').trim();
    const pct = parseFloat(raw);
    return Number.isNaN(pct) ? workspaceSplitRatio : pct / 100;
  }

  function saveWorkspaceLayout() {
    try {
      const value = workspaceLayoutMode === 'split'
        ? String(workspaceSplitRatio)
        : workspaceLayoutMode;
      localStorage.setItem(LAYOUT_KEY, value);
    } catch (_) { /* ignore */ }
  }

  function loadWorkspaceLayout() {
    try {
      const saved = localStorage.getItem(LAYOUT_KEY);
      if (saved === 'input-only' || saved === 'tree-only') {
        return { mode: saved, ratio: workspaceSplitRatio };
      }
      const ratio = parseFloat(saved);
      if (!Number.isNaN(ratio)) {
        return { mode: 'split', ratio };
      }
      const legacy = parseFloat(localStorage.getItem(PANE_RATIO_KEY));
      if (!Number.isNaN(legacy)) {
        return { mode: 'split', ratio: legacy };
      }
    } catch (_) { /* ignore */ }
    return { mode: 'split', ratio: LAYOUT_PRESETS.balanced };
  }

  function updateLayoutQuickActive() {
    const r = workspaceSplitRatio;
    const mode = workspaceLayoutMode;
    [
      { id: 'btn-layout-tree-only', active: mode === 'tree-only' },
      { id: 'btn-layout-tree', active: mode === 'split' && Math.abs(r - LAYOUT_PRESETS.tree) < 0.02 },
      { id: 'btn-layout-balanced', active: mode === 'split' && Math.abs(r - LAYOUT_PRESETS.balanced) < 0.02 },
      { id: 'btn-layout-input', active: mode === 'split' && Math.abs(r - LAYOUT_PRESETS.input) < 0.02 },
      { id: 'btn-layout-input-only', active: mode === 'input-only' },
    ].forEach(({ id, active }) => {
      $('#' + id)?.classList.toggle('active', active);
    });
  }

  function applyWorkspaceLayout(mode, ratio) {
    const workspace = $('#workspace');
    if (!workspace) return;

    workspaceLayoutMode = mode;
    workspace.classList.remove('layout-input-only', 'layout-tree-only');

    if (mode === 'input-only') {
      workspace.classList.add('layout-tree-only');
    } else if (mode === 'tree-only') {
      workspace.classList.add('layout-input-only');
    } else {
      workspaceSplitRatio = Math.min(0.85, Math.max(0.15, ratio ?? workspaceSplitRatio));
      workspace.style.setProperty('--input-pane-size', (workspaceSplitRatio * 100).toFixed(2) + '%');
    }

    saveWorkspaceLayout();
    updateLayoutQuickActive();
  }

  function setInputPaneRatio(ratio) {
    applyWorkspaceLayout('split', ratio);
  }

  function setWorkspaceLayoutMode(mode) {
    applyWorkspaceLayout(mode, workspaceSplitRatio);
  }

  function isSidebarCollapsed() {
    return $('#sidebar')?.classList.contains('collapsed') ?? false;
  }

  function setSidebarCollapsed(collapsed) {
    const sidebar = $('#sidebar');
    const main = $('.main');
    if (!sidebar || !main) return;
    sidebar.classList.toggle('collapsed', collapsed);
    main.classList.toggle('sidebar-collapsed', collapsed);
    try {
      localStorage.setItem(SIDEBAR_COLLAPSED_KEY, collapsed ? '1' : '0');
    } catch (_) { /* ignore */ }
  }

  function toggleSidebarCollapsed() {
    setSidebarCollapsed(!isSidebarCollapsed());
  }

  function getTheme() {
    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  }

  function updateThemeToggleButton(theme) {
    const btn = $('#btn-theme-toggle');
    if (!btn) return;
    const isLight = theme === 'light';
    btn.textContent = isLight ? '☾' : '☀';
    const label = isLight ? 'Switch to dark mode' : 'Switch to light mode';
    btn.title = label;
    btn.setAttribute('aria-label', label);
  }

  function setTheme(theme) {
    const next = theme === 'light' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try {
      localStorage.setItem(THEME_KEY, next);
    } catch (_) { /* ignore */ }
    updateThemeToggleButton(next);
  }

  function initThemeToggle() {
    updateThemeToggleButton(getTheme());
    $('#btn-theme-toggle')?.addEventListener('click', () => {
      setTheme(getTheme() === 'dark' ? 'light' : 'dark');
    });
  }

  function initLayoutQuickButtons() {
    $('#btn-layout-tree-only')?.addEventListener('click', () => setWorkspaceLayoutMode('tree-only'));
    $('#btn-layout-tree')?.addEventListener('click', () => setInputPaneRatio(LAYOUT_PRESETS.tree));
    $('#btn-layout-balanced')?.addEventListener('click', () => setInputPaneRatio(LAYOUT_PRESETS.balanced));
    $('#btn-layout-input')?.addEventListener('click', () => setInputPaneRatio(LAYOUT_PRESETS.input));
    $('#btn-layout-input-only')?.addEventListener('click', () => setWorkspaceLayoutMode('input-only'));
    $('#btn-sidebar-collapse')?.addEventListener('click', () => {
      if (isHistoryOverlayLayout()) setMobileSidebarOpen(false);
      else setSidebarCollapsed(true);
    });
    $('#btn-sidebar-expand')?.addEventListener('click', () => setSidebarCollapsed(false));

    if (localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === '1') {
      setSidebarCollapsed(true);
    }
  }

  function initPaneResizer() {
    const workspace = $('#workspace');
    const resizer = $('#workspace-resizer');
    if (!workspace || !resizer) return;

    const savedLayout = loadWorkspaceLayout();
    workspaceSplitRatio = savedLayout.ratio;
    applyWorkspaceLayout(savedLayout.mode, savedLayout.ratio);

    function updateResizerAria() {
      const stacked = workspaceIsStacked();
      resizer.setAttribute('aria-orientation', stacked ? 'horizontal' : 'vertical');
    }

    function resizeFromPointer(clientX, clientY) {
      const rect = workspace.getBoundingClientRect();
      const stacked = workspaceIsStacked();
      const total = stacked ? rect.height : rect.width;
      const pos = stacked ? clientY - rect.top : clientX - rect.left;
      const minPx = stacked ? PANE_MIN_PX_STACKED : PANE_MIN_PX;
      const minRatio = minPx / total;
      const maxRatio = 1 - minRatio;
      setInputPaneRatio(Math.min(maxRatio, Math.max(minRatio, pos / total)));
    }

    let dragging = false;

    function startDrag(e) {
      if (isContentScrollLayout()) return;
      if (e.button !== undefined && e.button !== 0) return;
      e.preventDefault();
      dragging = true;
      document.body.classList.add('is-resizing-panes');
      if (workspaceIsStacked()) document.body.classList.add('is-resizing-panes-row');
      resizer.setPointerCapture(e.pointerId);
    }

    function onDrag(e) {
      if (!dragging) return;
      resizeFromPointer(e.clientX, e.clientY);
    }

    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      document.body.classList.remove('is-resizing-panes', 'is-resizing-panes-row');
      try {
        resizer.releasePointerCapture(e.pointerId);
      } catch (_) { /* ignore */ }
    }

    resizer.addEventListener('pointerdown', startDrag);
    resizer.addEventListener('pointermove', onDrag);
    resizer.addEventListener('pointerup', endDrag);
    resizer.addEventListener('pointercancel', endDrag);

    resizer.addEventListener('keydown', (e) => {
      const step = e.shiftKey ? 0.1 : 0.05;
      const current = workspaceLayoutMode === 'split' ? workspaceSplitRatio : LAYOUT_PRESETS.balanced;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        setInputPaneRatio(current - step);
      } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        e.preventDefault();
        setInputPaneRatio(current + step);
      }
    });

    updateResizerAria();
    window.addEventListener('resize', updateResizerAria);
  }



  const IS_EMBED = new URLSearchParams(location.search).has('embed');
  if (IS_EMBED) {
    document.documentElement.classList.add('is-embed');
    document.body.classList.add('is-embed');
  }

  function initJsonStudioToolSwitch() {
    document.querySelectorAll('.tool-switch-link[data-tool]').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (btn.dataset.tool === 'color') {
          if (IS_EMBED && window.parent !== window) {
            window.parent.postMessage({ type: 'json-studio-switch-tool', tool: 'color' }, '*');
          } else {
            location.href = 'index.html#color';
          }
        }
      });
    });
  }

  window.addEventListener('message', (e) => {
    if (e.data?.type === 'json-studio-theme') {
      setTheme(e.data.theme);
    }
  });

  /* ── Init ────────────────────────────────────────────────────── */
  async function init() {
    initThemeToggle();
    initMobileLayout();
    initLayoutQuickButtons();
    initPaneResizer();
    initPortraitContentScroll();
    try {
      db = await openDB();
    } catch (err) {
      console.error('[JSON Studio] IndexedDB unavailable:', err);
      toast('Local storage unavailable', 'error');
    }

    jsonInput.value = SAMPLE_JSON;
    await refreshHistory();
    await parseAndRender(false);
  }

  init();
  initJsonStudioToolSwitch();
})();
</script>
</body>
</html>
