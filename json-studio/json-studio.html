<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>JSON Studio</title>
  <script>
    (function () {
      var key = 'json-studio-theme';
      var theme = localStorage.getItem(key);
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    :root {
      --sidebar-width: 300px;
      --header-height: 56px;
      --radius: 10px;
      --font-mono: "SF Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f1117;
      --bg-elevated: #161b22;
      --bg-hover: #1c2333;
      --border: #2d333b;
      --border-hover: #444c56;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --accent-soft: rgba(88, 166, 255, 0.12);
      --accent-border-soft: rgba(88, 166, 255, 0.25);
      --history-active-border: rgba(88, 166, 255, 0.3);
      --success: #3fb950;
      --warning: #d29922;
      --danger: #f85149;
      --json-key: #79c0ff;
      --json-string: #a5d6ff;
      --json-number: #79c0ff;
      --json-bool: #ff7b72;
      --json-null: #ff7b72;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      --overlay-bg: rgba(15, 17, 23, 0.85);
      --btn-primary-text: #0d1117;
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #ffffff;
      --bg-elevated: #f6f8fa;
      --bg-hover: #eaeef2;
      --border: #d0d7de;
      --border-hover: #8c959f;
      --text: #1f2328;
      --text-muted: #656d76;
      --accent: #0969da;
      --accent-hover: #0550ae;
      --accent-soft: rgba(9, 105, 218, 0.1);
      --accent-border-soft: rgba(9, 105, 218, 0.25);
      --history-active-border: rgba(9, 105, 218, 0.35);
      --success: #1a7f37;
      --warning: #9a6700;
      --danger: #cf222e;
      --json-key: #0550ae;
      --json-string: #0a3069;
      --json-number: #0550ae;
      --json-bool: #cf222e;
      --json-null: #cf222e;
      --shadow: 0 8px 24px rgba(140, 149, 159, 0.2);
      --overlay-bg: rgba(255, 255, 255, 0.88);
      --btn-primary-text: #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      height: 100vh;
      height: 100dvh;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }

    .tool-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }

    body.is-embed .tool-body {
      flex: 1;
      min-height: 0;
    }

    .page-intro {
      flex-shrink: 0;
      padding: 16px 20px 0;
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
    }

    .page-title {
      margin: 0 0 4px;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }

    .page-desc {
      margin: 0 0 10px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.45;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: var(--header-height);
      padding: 0 20px;
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
      padding-top: max(0px, env(safe-area-inset-top));
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
      z-index: 30;
      position: relative;
      flex-wrap: wrap;
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    @media (min-width: 769px) {
      .logo-block { order: 1; }
      .header-actions { order: 2; flex: 1; min-width: 0; }
      .header-tools { order: 3; }
      .options-bar { order: 4; }
    }

    .logo-block {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .tool-switch {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      flex-shrink: 0;
    }

    .tool-switch-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }

    .tool-switch-link:hover {
      color: var(--text);
      background: var(--bg-hover);
    }

    .tool-switch-link.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    button.tool-switch-link {
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
    }
    body.is-embed .logo-block,
    body.is-embed .tool-switch,
    body.is-embed #btn-theme-toggle { display: none; }

    html.is-embed,
    body.is-embed,
    body.is-embed .app {
      height: 100%;
      width: 100%;
      min-height: 0;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }

    body.is-embed .app {
      grid-template-rows: auto minmax(0, 1fr);
    }

    body.is-embed .page-intro { display: none; }

    body.is-embed .panel-input,
    body.is-embed .panel-tree {
      min-height: 240px;
    }

    body.is-embed .header {
      gap: 6px;
      min-height: 0;
      padding-top: max(4px, env(safe-area-inset-top));
      padding-bottom: 4px;
    }

    body.is-embed .header-actions .btn {
      padding: 6px 10px;
      min-height: 34px;
    }

    body.is-embed .options-bar {
      padding-top: 4px;
      padding-bottom: 2px;
    }

    body.is-embed .panel-header {
      padding: 6px 12px;
    }


    .logo-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #58a6ff, #a371f7);
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:hover { background: var(--bg-hover); border-color: var(--border-hover); }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--btn-primary-text);
    }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-danger { color: var(--danger); }
    .btn-danger:hover { background: rgba(248, 81, 73, 0.12); border-color: var(--danger); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-icon {
      padding: 7px 11px;
      min-width: 36px;
      justify-content: center;
    }

    .layout-quick {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
    }

    .layout-quick .btn-layout {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      width: 28px;
      height: 28px;
      min-width: 28px;
      min-height: 28px;
      padding: 0;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1;
    }

    .layout-quick .btn-layout:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    .layout-quick .btn-layout.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .icon-btn:hover {
      background: var(--bg-hover);
      color: var(--accent);
      border-color: var(--border-hover);
    }

    .options-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-left: auto;
      flex-wrap: wrap;
    }

    .option-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .option-label input { accent-color: var(--accent); }

    .cache-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .cache-bar {
      width: 60px;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      overflow: hidden;
    }

    .cache-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--success), var(--warning), var(--danger));
      border-radius: 2px;
      transition: width 0.3s;
    }

    /* Main layout */
    .main {
      flex: 1;
      min-height: 100%;
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr;
      overflow: hidden;
    }

    .sidebar {
      border-right: 1px solid var(--border);
      background: var(--bg-elevated);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .sidebar-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .sidebar-header-row .sidebar-title {
      margin-bottom: 0;
    }

    .sidebar-expanded-only {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .sidebar-collapsed-only {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      padding: 12px 0;
    }

    .main.sidebar-collapsed {
      --sidebar-width: 48px;
    }

    .sidebar.collapsed .sidebar-expanded-only {
      display: none;
    }

    .sidebar.collapsed .sidebar-collapsed-only {
      display: flex;
    }

    .sidebar-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text-muted); }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .history-list::-webkit-scrollbar { width: 6px; }
    .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .history-empty {
      padding: 32px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      margin-bottom: 4px;
      transition: background 0.15s, border-color 0.15s;
      position: relative;
    }

    .history-item:hover { background: var(--bg-hover); }
    .history-item.active {
      background: var(--accent-soft);
      border-color: var(--history-active-border);
    }

    .history-date {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .history-summary {
      font-size: 13px;
      line-height: 1.4;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-word;
    }

    .history-meta {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      font-size: 10px;
      color: var(--text-muted);
    }

    .history-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .history-item:hover .history-actions { opacity: 1; }

    .history-action {
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 12px;
      transition: background 0.15s, color 0.15s;
    }

    .history-action:hover { background: var(--bg-hover); color: var(--accent); }
    .history-action.danger:hover { background: rgba(248, 81, 73, 0.15); color: var(--danger); }

    .cache-path {
      font-size: 10px;
      color: var(--text-muted);
      padding: 0 16px 8px;
      word-break: break-all;
      line-height: 1.4;
    }

    .sidebar-footer {
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    .sidebar-footer .btn { flex: 1; justify-content: center; font-size: 12px; padding: 6px 10px; }

    /* Editor / Viewer split */
    .workspace {
      display: flex;
      flex-direction: row;
      overflow: hidden;
      min-height: 100%;
      --input-pane-size: 50%;
    }

    .panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }

    .panel-input {
      flex: 0 0 var(--input-pane-size);
      min-width: 160px;
      max-width: calc(100% - 166px);
      min-height: 200px;
    }

    .panel-tree {
      flex: 1 1 0;
      min-width: 160px;
      min-height: 200px;
    }

    .workspace-resizer {
      flex: 0 0 6px;
      background: var(--border);
      cursor: col-resize;
      z-index: 2;
      transition: background 0.15s;
      touch-action: none;
    }

    .workspace-resizer:hover,
    body.is-resizing-panes .workspace-resizer {
      background: var(--accent);
    }

    .workspace.layout-tree-only .panel-tree,
    .workspace.layout-tree-only .workspace-resizer {
      display: none;
    }

    .workspace.layout-tree-only .panel-input {
      flex: 1 1 100%;
      max-width: none;
      min-width: 0;
    }

    .workspace.layout-input-only .panel-input,
    .workspace.layout-input-only .workspace-resizer {
      display: none;
    }

    .workspace.layout-input-only .panel-tree {
      flex: 1 1 100%;
      min-width: 0;
    }

    body.is-resizing-panes {
      user-select: none;
      cursor: col-resize;
    }

    body.is-resizing-panes.is-resizing-panes-row {
      cursor: row-resize;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .panel-header > span:first-child {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .panel-header > span:last-child {
      flex: 0 0 auto;
      max-width: 58%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
    }

    .panel-body {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #json-input {
      width: 100%;
      max-width: 100%;
      height: 100%;
      padding: 16px;
      border: none;
      outline: none;
      resize: none;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      tab-size: 2;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    #json-renderer {
      margin: 0;
      padding: 16px;
      height: 100%;
      overflow: auto;
      background: var(--bg);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      tab-size: 2;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    #json-renderer::-webkit-scrollbar { width: 8px; height: 8px; }
    #json-renderer::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* JSON tree — compact layout aligned with 2-space formatted JSON */
    .json-document {
      padding: 0;
      --json-indent: 2ch;
      max-width: 100%;
      overflow-x: hidden;
    }

    ul.json-dict, ol.json-array {
      list-style: none;
      margin: 0;
      padding: 0;
      border: none;
    }

    ul.json-dict > li,
    ol.json-array > li {
      display: block;
      padding-left: var(--json-indent);
    }

    .json-value-block {
      display: block;
    }

    .json-trailing-comma {
      display: inline;
    }

    .json-collection {
      display: inline;
      white-space: normal;
    }

    /* Array items & block collections: must not be inline (block kids inside inline reorder wrongly) */
    .json-collection.is-expanded:not(.json-inline-open) {
      display: block;
    }

    /* Root / array-item: opening bracket on its own line */
    .json-collection.is-expanded > .json-bracket-open {
      display: block;
    }

    .json-collection.is-expanded > .json-bracket-close {
      display: block;
    }

    .json-collection.is-expanded > .json-close-line {
      display: block;
    }

    .json-collection.is-expanded > .json-close-line > .json-bracket-close,
    .json-collection.is-expanded > .json-close-line > .json-trailing-comma {
      display: inline;
    }

    /* Root: caret + { inline; body indented under { */
    .json-root > .json-toggle.json-root-toggle,
    .json-root-inner > .json-toggle.json-root-toggle {
      margin-left: 0;
      margin-right: 0.35em;
      vertical-align: baseline;
    }

    .json-root > .json-toggle.json-root-toggle + .json-collection:not(.is-expanded),
    .json-root-inner > .json-toggle.json-root-toggle + .json-collection:not(.is-expanded) {
      display: inline;
      vertical-align: baseline;
    }

    .json-root.json-root-flat > .json-bracket-open,
    .json-root-inner.json-root-flat > .json-bracket-open {
      display: inline;
    }

    .json-root.json-root-flat > ul.json-dict,
    .json-root.json-root-flat > ol.json-array,
    .json-root-inner.json-root-flat > ul.json-dict,
    .json-root-inner.json-root-flat > ol.json-array {
      display: block;
      padding-left: calc(1.45em + 0.35em);
    }

    .json-root.json-root-flat > .json-close-line,
    .json-root.json-root-flat > .json-bracket-close,
    .json-root-inner.json-root-flat > .json-close-line,
    .json-root-inner.json-root-flat > .json-bracket-close {
      display: block;
      padding-left: calc(1.45em + 0.35em);
    }

    /* Nested flat nodes: header block on one line, body/close on lines below */
    li.json-flat-value {
      display: block;
    }

    .json-flat-head {
      display: block;
    }

    .json-flat-prefix {
      display: inline-flex;
      align-items: baseline;
      min-width: 0;
    }

    .json-flat-head > .json-collection,
    .json-flat-head > .json-bracket-open {
      display: inline;
      vertical-align: baseline;
    }

    li.json-flat-value > ul.json-dict,
    li.json-flat-value > ol.json-array {
      display: block;
    }

    li.json-flat-value > .json-close-line,
    li.json-flat-value > .json-bracket-close {
      display: block;
    }

    .json-string { color: var(--json-string); font-size: inherit; overflow-wrap: anywhere; word-break: break-word; }
    .json-key { color: var(--json-key); font-size: inherit; }
    .json-literal { color: var(--json-bool); font-weight: 600; font-size: inherit; overflow-wrap: anywhere; word-break: break-word; }
    .json-number { color: var(--json-number); font-size: inherit; overflow-wrap: anywhere; word-break: break-word; }

    button.json-toggle,
    a.json-toggle {
      display: inline-flex;
      align-items: baseline;
      vertical-align: baseline;
      position: relative;
      color: inherit;
      text-decoration: none;
      border: none;
      background: none;
      padding: 0;
      margin: 0 0 0 calc(-1 * var(--json-indent, 2ch));
      font: inherit;
      font-size: inherit;
      line-height: inherit;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      cursor: pointer;
      text-align: left;
      gap: 0.5em;
    }

    button.json-toggle:has(.json-key),
    a.json-toggle:has(.json-key) {
      gap: 0.3em;
    }

    button.json-toggle .json-key,
    a.json-toggle .json-key {
      margin-left: 0;
    }

    button.json-toggle:focus,
    a.json-toggle:focus { outline: none; }

    button.json-toggle::before,
    a.json-toggle::before {
      flex: 0 0 1.45em;
      width: 1.45em;
      font-size: 0.75em;
      color: var(--text-muted);
      content: "\25BC";
      display: inline-block;
      text-align: center;
      line-height: 1.6;
      transition: transform 0.15s;
      transform-origin: center center;
    }

    button.json-toggle:hover::before,
    a.json-toggle:hover::before { color: var(--accent); }
    button.json-toggle.collapsed::before,
    a.json-toggle.collapsed::before { transform: rotate(-90deg); }

    button.json-placeholder,
    a.json-placeholder {
      color: var(--text-muted);
      padding: 0 0.5em;
      text-decoration: none;
      font-style: italic;
      font-size: 0.9em;
      border: none;
      background: none;
      font: inherit;
      cursor: pointer;
    }

    button.json-placeholder:hover,
    a.json-placeholder:hover { color: var(--accent); text-decoration: underline; }

    a.json-link {
      position: relative;
      z-index: 1;
    }

    a.json-link { color: var(--accent); text-decoration: none; }
    a.json-link:hover { text-decoration: underline; }

    .json-truncated {
      color: var(--warning);
      font-style: italic;
      font-size: 0.9em;
      list-style: none;
      padding: 2px 0;
    }

    .json-large-notice {
      padding: 10px 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border-soft);
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.5;
      font-family: var(--font-sans);
    }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      padding: 10px 16px;
      border-radius: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      font-size: 13px;
      animation: slideIn 0.25s ease;
      max-width: 360px;
    }

    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }
    .toast.info { border-color: var(--accent); }

    .toast.toast-confirm {
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(12px);
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: min(92vw, 360px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 1001;
      box-shadow: none;
      animation: none;
    }

    .toast.toast-confirm.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .toast-confirm-msg {
      flex: 1;
      min-width: 0;
    }

    .toast-confirm-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .toast-confirm-actions .btn {
      padding: 5px 10px;
      font-size: 12px;
    }

    .toast-confirm-actions .btn-danger {
      border-color: var(--danger);
      color: var(--danger);
    }

    .toast-confirm-actions .btn-danger:hover {
      background: rgba(248, 81, 73, 0.12);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Drop overlay */
    .drop-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(4px);
      display: none;
      place-items: center;
      z-index: 999;
      pointer-events: none;
    }

    .drop-overlay.visible { display: grid; }

    .drop-message {
      padding: 32px 48px;
      border: 2px dashed var(--accent);
      border-radius: 16px;
      font-size: 18px;
      color: var(--accent);
      background: var(--accent-soft);
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      top: var(--header-offset, var(--header-height));
      right: 0;
      bottom: 0;
      left: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 25;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
    }

    .sidebar-backdrop.visible { display: block; }

    /* Responsive — tablet / narrow desktop */
    @media (max-width: 1100px) {
      html, body {
        overflow-x: clip;
      }

      .header {
        gap: 10px;
        padding: 8px 14px;
        padding-left: max(14px, env(safe-area-inset-left));
        padding-right: max(14px, env(safe-area-inset-right));
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
        overflow-x: clip;
      }

      .header-tools {
        flex: 1 1 auto;
        min-width: 0;
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .header-tools::-webkit-scrollbar { display: none; }

      .options-bar {
        order: 10;
        width: 100%;
        margin-left: 0;
        padding-top: 6px;
        border-top: 1px solid var(--border);
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .options-bar::-webkit-scrollbar { display: none; }

      .tool-body {
        flex: 1;
        min-height: 0;
        min-width: 0;
        width: 100%;
        max-width: 100%;
        overflow-x: clip;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        contain: inline-size;
      }

      .main {
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        min-height: auto;
        min-width: 0;
        max-width: 100%;
        width: 100%;
        overflow-x: clip;
        overflow-y: visible;
        contain: inline-size;
      }

      .sidebar {
        position: fixed;
        display: none;
        z-index: 40;
      }

      .sidebar.open {
        display: flex;
      }

      .workspace {
        flex: 1 1 auto;
        flex-direction: column;
        align-self: stretch;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        height: auto;
        min-height: 0;
        overflow-x: clip;
        contain: inline-size;
      }

      .panel {

        align-self: stretch;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        overflow-x: clip;
        contain: inline-size;
      }

      .panel-header {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
        overflow-x: clip;
      }

      .panel-input,
      .panel-tree {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        flex: none;
        min-height: 0;
        max-height: none;
      }

      .panel-body {
        flex: none;
        overflow-x: clip;
        height: auto;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      #json-input,
      #json-renderer {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
      }

      #json-input {
        display: block;
        height: auto;
        min-height: 6em;
        overflow-x: hidden;
        overflow-y: hidden;
        resize: none;
        field-sizing: fixed;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      #json-renderer {
        height: auto;
        overflow-x: hidden;
        overflow-y: visible;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      #json-renderer .json-string,
      #json-renderer .json-number,
      #json-renderer .json-literal,
      #json-renderer a.json-link {
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      ul.json-dict,
      ol.json-array,
      ul.json-dict > li,
      ol.json-array > li {
        max-width: 100%;
      }

      button.json-toggle,
      a.json-toggle {
        margin-left: 0;
        max-width: 100%;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .workspace-resizer {
        display: none;
      }
    }

    /* Portrait stacked — scroll + left history drawer */
    @media (max-width: 1100px) and (orientation: portrait) {
      .page-intro {
        flex-shrink: 0;
      }

      .sidebar {
        top: var(--header-offset, var(--header-height));
        bottom: 0;
        left: 0;
        right: auto;
        width: min(100%, 360px);
        max-width: 100%;
        padding-bottom: env(safe-area-inset-bottom);
        box-shadow: var(--shadow);
        border-right: 1px solid var(--border);
        border-radius: 0;
        animation: none;
      }
    }

    /* Landscape — history toast sheet; panels use stacked content scroll from ≤1100px */
    @media (max-width: 1100px) and (orientation: landscape) {
      /* Parse history — bottom toast sheet (not left/top sidebar) */
      .sidebar {
        display: none;
        position: fixed;
        top: auto;
        left: max(12px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
        width: auto;
        max-width: none;
        max-height: min(52vh, 360px);
        border-radius: 12px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        z-index: 40;
        background: var(--bg-elevated);
        animation: historyToastIn 0.22s ease;
      }

      .sidebar.open {
        display: flex;
      }

      .sidebar.collapsed .sidebar-collapsed-only {
        display: none;
      }

      .sidebar.collapsed .sidebar-expanded-only,
      .sidebar .sidebar-expanded-only {
        display: flex;
      }

      .sidebar-header-row #btn-sidebar-collapse {
        display: none;
      }

      .sidebar-header {
        padding: 10px 12px 8px;
        flex-shrink: 0;
      }

      .sidebar-title {
        font-size: 11px;
        margin-bottom: 8px;
      }

      .search-input {
        padding: 7px 10px;
        font-size: 12px;
      }

      .cache-path {
        display: none;
      }

      .history-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 6px 8px;
        -webkit-overflow-scrolling: touch;
      }

      .history-item {
        padding: 8px 10px;
        padding-right: 52px;
        margin-bottom: 4px;
      }

      .history-summary {
        font-size: 12px;
        -webkit-line-clamp: 1;
      }

      .history-date {
        font-size: 10px;
      }

      .history-meta span:last-child {
        display: none;
      }

      .history-actions {
        opacity: 1;
      }

      .sidebar-footer {
        flex-shrink: 0;
        padding: 8px 10px;
      }

      .sidebar-backdrop {
        z-index: 35;
      }
    }

    @keyframes historyToastIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive — phone */
    @media (max-width: 768px) {
      .header {
        gap: 8px;
        padding: 8px 12px;
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
      }

      .page-intro {
        padding: 10px 12px 0;
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
      }

      .page-title {
        font-size: 1rem;
        margin-bottom: 6px;
      }

      .page-desc { display: none; }

      .logo-block {
        order: 1;
        flex: 0 1 auto;
        min-width: 0;
        gap: 8px;
      }

      .logo {
        font-size: 0.98rem;
      }

      .tool-switch-link {
        padding: 5px 8px;
        font-size: 11px;
      }

      .header-tools {
        order: 2;
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1 1 100%;
        width: 100%;
        min-width: 0;
        margin-left: 0;
        justify-content: flex-start;
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        padding-bottom: 2px;
      }

      .header-tools::-webkit-scrollbar { display: none; }

      .header-actions {
        order: 3;
        flex: 1 1 100%;
        width: 100%;
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        gap: 6px;
        padding-bottom: 2px;
      }

      .header-actions::-webkit-scrollbar { display: none; }

      .layout-quick {
        flex-shrink: 0;
        gap: 2px;
        padding: 2px;
      }

      .layout-quick .btn-layout {
        width: 36px;
        height: 36px;
        min-width: 36px;
        min-height: 36px;
        font-size: 15px;
      }

      .header-actions .btn {
        padding: 8px 12px;
        min-height: 40px;
      }

      .icon-btn {
        width: 36px;
        height: 36px;
        min-width: 36px;
        min-height: 36px;
        font-size: 14px;
      }

      .options-bar {
        order: 4;
        flex: 1 1 100%;
        width: 100%;
        margin-left: 0;
        padding-top: 6px;
        border-top: 1px solid var(--border);
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .options-bar::-webkit-scrollbar { display: none; }

      .main { min-width: 0; max-width: 100%; }

      .workspace {
        min-width: 0;
        max-width: 100%;
      }

      .main.sidebar-collapsed { --sidebar-width: 0; }

      .panel-header {
        padding: 8px 12px;
        font-size: 11px;
      }

      .panel-header > span:last-child {
        flex: 0 0 auto;
        max-width: 70%;
      }

      #json-input {
        padding: 12px;
        font-size: 16px;
        line-height: 1.5;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        field-sizing: fixed;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
        overflow-x: hidden;
      }

      #json-renderer {
        padding: 12px;
        font-size: 13px;
        line-height: 1.6;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      .toast-container {
        left: 12px;
        right: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));

      .toast.toast-confirm {
        bottom: max(12px, env(safe-area-inset-bottom));
      }

      .drop-message {
        margin: 0 20px;
        padding: 24px 28px;
        font-size: 16px;
      }

    @media (max-width: 420px) {
      .logo-text { display: none; }

      .btn-hide-xs { display: none; }

      .layout-quick .btn-layout,
      .header-tools .icon-btn {

        height: 34px;
        min-width: 34px;
        min-height: 34px;
        font-size: 14px;
      }
    }

    @media (hover: none) {
      .history-actions { opacity: 1; }
      .history-item { padding-right: 56px; }
    }

    /* Compact history list — short viewports (not landscape toast sheet) */
    @media (max-height: 560px), (max-width: 768px) and (max-height: 520px) and (orientation: portrait) {
      .page-intro { display: none; }

      .sidebar-header {
        padding: 8px 10px 6px;
      }

      .sidebar-header-row {
        margin-bottom: 6px;
      }

      .sidebar-title {
        font-size: 11px;
      }

      .search-input {
        padding: 6px 10px;
        font-size: 12px;
      }

        font-size: 10px;

      }

      .history-summary {

      }

        height: 20px;
        font-size: 11px;
      }

      }

      .sidebar-footer .btn {
        padding: 4px 8px;
        font-size: 11px;
      }
    }

    .hidden-input { display: none; }
  </style>

<body>
  <div class="app">
    <header class="header">
      <div class="logo-block">
        <div class="logo">
          <div class="logo-icon">{ }</div>
          <span class="logo-text">JSON Studio</span>
        </div>
        <nav class="tool-switch" aria-label="Switch tool">
          <button type="button" class="tool-switch-link active" data-tool="json" aria-current="page">JSON</button>
          <button type="button" class="tool-switch-link" data-tool="color">RGB ↔ Hex</button>
        </nav>
      </div>
      <div class="header-tools">
        <div class="layout-quick" role="group" aria-label="Panel layout">
          <button type="button" class="btn btn-layout" id="btn-layout-tree-only" title="Tree only — hide input">◩</button>
          <button type="button" class="btn btn-layout" id="btn-layout-tree" title="More tree view">◧</button>
          <button type="button" class="btn btn-layout active" id="btn-layout-balanced" title="Balanced split">◫</button>
          <button type="button" class="btn btn-layout" id="btn-layout-input" title="More input">◨</button>
          <button type="button" class="btn btn-layout" id="btn-layout-input-only" title="Input only — hide tree">◪</button>
        </div>
        <button type="button" class="icon-btn" id="btn-theme-toggle" title="Switch theme" aria-label="Switch theme">☀</button>
        <button type="button" class="icon-btn" id="btn-history-toggle" title="Toggle history panel" aria-label="Toggle history panel">☰</button>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" id="btn-parse" title="Parse &amp; format JSON">Parse</button>
        <button class="btn btn-hide-xs" id="btn-minify" title="Minify JSON">Minify</button>
        <button class="btn" id="btn-copy" title="Copy formatted JSON">Copy</button>
        <button class="btn" id="btn-upload" title="Upload JSON file">Upload</button>
        <input type="file" id="file-input" class="hidden-input" accept=".json,.txt,application/json">
      </div>
      <div class="options-bar" id="options-bar">
